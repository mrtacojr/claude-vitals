  <!-- CLI vitals -->
  <rect class="win" x="10" y="316" width="740" height="94" rx="10"/>
  <text x="30" y="342"><tspan class="dim">$ </tspan><tspan class="txt">vitals</tspan></text>
  <text x="30" y="362"><tspan class="red">🔴 esperando</tspan><tspan class="txt">   nxt-cotizador   2m     (necesita tu respuesta)</tspan></text>
  <text x="30" y="380"><tspan class="green">🟢 trabajando</tspan><tspan class="txt">  apollo          8s</tspan></text>
  <text x="30" y="398"><tspan class="yellow">🟡 detenida</tspan><tspan class="txt">    tri-audit       25m</tspan></text>
